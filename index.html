<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>PROP's Mass/Weight and Energy/Power Sizing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brandmark">P</div>
      <div class="brandname">PROP's Mass/Weight and Energy/Power Sizing</div>
    </div>
    <div class="top-actions">
      <div id="dbBadge" class="badge ready"><span class="dot"></span> Thin Electric APC</div>
      <button id="resetBtn" class="ghost">Reset</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="input-panel panel">
      <div class="panel-heading"><h2>Inputs</h2></div>

      <nav id="tabs" class="tabs" aria-label="Input tabs">
        <button data-tab="STRUCT" class="active">STRUCT</button>
        <button data-tab="GNC">GNC</button>
        <button data-tab="PWR">PWR</button>
      </nav>

      <div id="mobileLive" class="mobile-live" aria-label="Live sizing summary">
        <div><small>Mass ceiling</small><strong id="mobileMass">—</strong></div>
        <div><small>Battery</small><strong id="mobileBattery">—</strong></div>
        <div><small>15-min energy</small><strong id="mobileEnergy">—</strong></div>
      </div>

      <div id="inputContent" class="input-content"></div>
    </aside>

    <section class="visual-panel panel">
      <div class="visual-head">
        <div>
          <span id="viewEyebrow" class="eyebrow">STRUCT</span>
          <h1 id="viewTitle">Rotor packaging</h1>
          <p id="viewSub"></p>
        </div>
        <div class="chip">LIVE</div>
      </div>
      <div id="visual" class="visual"></div>
      <div id="insightBar" class="insight-bar"></div>
    </section>

    <aside class="results-panel panel">
      <div class="panel-heading"><h2>Sizing outputs</h2></div>
      <div id="cards" class="cards"></div>
    </aside>
  </main>

  <footer>PROP reference: LiPo ≈ 160 Wh/kg · Li-ion ≈ 200 Wh/kg</footer>
</div>
<script src="app.js"></script>
</body>
</html>
